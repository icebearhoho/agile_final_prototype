<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>MOE Admin Portal — Education Account (Mock)</title>
<style>
  :root{
    --navy:#7A1F2B; --navy-2:#8A2538;
    --blue:#A8343F; --blue-soft:#F9E3E5;
    --red:#B3261E; --red-soft:#FDE3E3;
    --green:#18794A; --green-soft:#E4F4EC;
    --amber:#8F5F00; --amber-soft:#FDF1D6;
    --purple:#6B46C1; --purple-soft:#F3EDFC;
    --sp-red:#D93841; --sp-red-hover:#B0262D;
    --gray:#5E5658; --gray-soft:#F6F3F3;
    --line:#E4DEDE;
    --ink:#1A1512;
    --radius:10px;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
    --shadow-lg:0 10px 28px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter Variable","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#F8F6F6;font-size:15px;line-height:1.55}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}

  /* ---------- layout: header + sidebar ---------- */
  .app-header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:40}
  .app-header .inner{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .crest{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .brand{flex:1;min-width:200px}
  .brand b{display:block;font-size:15.5px}
  .brand span{font-size:12px;opacity:.75}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:13px}
  .user-chip .avatar{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .user-chip button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px}
  .layout{max-width:1280px;margin:0 auto;display:flex;gap:0;align-items:flex-start}
  .sidebar{width:236px;flex:none;position:sticky;top:61px;padding:18px 0 40px}
  .sidebar .grp{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--gray);text-transform:uppercase;padding:14px 18px 6px}
  .sidebar a{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13.5px;font-weight:600;color:#2E2628;text-decoration:none;border-left:3px solid transparent}
  .sidebar a:hover{background:#F6F3F3}
  .sidebar a.on{color:var(--blue);border-left-color:var(--blue);background:var(--blue-soft)}
  .sidebar a .ic{width:20px;text-align:center;flex:none}
  .sidebar a.sub{padding:7px 18px 7px 46px;font-size:13px}
  .sidebar a .chev{margin-left:auto;font-size:10px;opacity:.7;flex:none}
  .content{flex:1;min-width:0;padding:22px 20px 70px}
  .sim-banner{background:repeating-linear-gradient(45deg,#6B46C1,#6B46C1 16px,#5A3AA6 16px,#5A3AA6 32px);color:#fff;padding:10px 20px;display:flex;gap:14px;align-items:center;font-size:13.5px}
  .sim-banner button{background:#fff;color:var(--purple);border:none;border-radius:6px;padding:5px 12px;font-weight:700}

  /* ---------- generic ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .card-h h3{font-size:15px}
  .card .card-b{padding:18px}
  h1.page{font-size:21px;margin-bottom:4px}
  p.page-sub{color:var(--gray);font-size:13.5px;margin-bottom:18px}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#7A1F2B}
  .btn-danger{background:var(--red);color:#fff}
  .btn-ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn-ghost:not(:hover){border-color:#DDD7D7;color:#2E2628}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:7px 12px;font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-gray{background:var(--gray-soft);color:var(--gray)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-purple{background:var(--purple-soft);color:var(--purple)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .muted{color:var(--gray);font-size:13px}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th{background:var(--gray-soft);text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);border-bottom:1px solid var(--line)}
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.tbl tr:last-child td{border-bottom:none}
  table.tbl tr.clickable{cursor:pointer}
  table.tbl tr.clickable:hover td{background:#FBFAF9}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pos{color:var(--green);font-weight:600}
  .neg{color:var(--red);font-weight:600}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:14px}
  .empty{padding:34px 20px;text-align:center;color:var(--gray)}
  .empty .big{font-size:34px;margin-bottom:8px}

  .login-wrap{max-width:480px;margin:48px auto}
  .divider{display:flex;align-items:center;gap:12px;color:var(--gray);font-size:12px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .search-row input,.search-row select{border:1.5px solid #DDD7D7;border-radius:8px;padding:10px 12px;background:#fff}
  .search-row input{flex:1;min-width:200px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--gray)}
  .tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:11.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .stat .val{font-size:21px;font-weight:700}
  .meter{height:10px;border-radius:999px;background:var(--gray-soft);overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;border-radius:999px;background:var(--green)}
  .meter i.warn{background:var(--amber)} .meter i.over{background:var(--red)}

  .charge{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:#fff}
  .charge.overdue{border-color:#E8BFC3}
  .charge-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:#FBFAFA;border-bottom:1px solid var(--line)}
  .charge-h .ttl{font-weight:700;font-size:14.5px}
  .charge-h .ref{font-size:12px;color:var(--gray)}
  .charge-b{padding:14px 16px}
  .charge-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#FBFAFA}
  .payable-big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#2E2628}
  .field input,.field select{width:100%;border:1.5px solid #DDD7D7;border-radius:8px;padding:9px 11px;font-size:13.5px;background:#fff}
  .field input:read-only{background:var(--gray-soft)}
  .field.err input,.field.err select{border-color:var(--red);background:#FFFBFB}
  .field .hint{font-size:11.5px;color:var(--gray);margin-top:3px}
  .field.err .hint{color:var(--red);font-weight:600}
  .comp-row{display:grid;grid-template-columns:1fr 110px 30px;gap:8px;margin-bottom:8px;align-items:center}
  .comp-row input{border:1.5px solid #DDD7D7;border-radius:8px;padding:8px 10px;font-size:13.5px}
  .comp-row button{border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--red);font-weight:700}
  .form-sec h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin:14px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .kv{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
  .kv td{padding:7px 4px;border-bottom:1px dashed var(--line)}
  .kv td:first-child{color:var(--gray)}
  .kv td:last-child{text-align:right;font-weight:600}

  .flow{display:flex;flex-wrap:wrap;margin-bottom:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .flow a{flex:1;min-width:190px;padding:11px 14px;font-size:12.5px;font-weight:600;color:var(--gray);text-decoration:none;display:flex;gap:9px;align-items:center;border-right:1px solid var(--line);background:#fff}
  .flow a:last-child{border-right:none}
  .flow .n{width:22px;height:22px;border-radius:50%;background:var(--gray-soft);color:var(--gray);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
  .flow a.on{color:var(--navy);background:var(--blue-soft)}
  .flow a.on .n{background:var(--navy);color:#fff}
  .flow a.done{color:var(--green)}
  .flow a.done .n{background:var(--green-soft);color:var(--green)}

  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto}
  .modal .m-h{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .modal .m-b{padding:16px 18px;text-align:left}
  .modal .m-b.solo{padding:34px;text-align:center}
  .modal .m-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .modal .m-f .btn{padding:8px 14px;font-size:13px}
  .modal .field{margin-bottom:11px}
  .modal .field label{font-size:12px;margin-bottom:4px}
  .modal .field input,.modal .field select{padding:8px 10px;font-size:13px}
  .modal .comp-row{gap:6px;margin-bottom:6px}
  .modal .comp-row input{padding:7px 9px;font-size:12.5px}
  .radio-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .radio-card.sel{border-color:var(--blue);background:var(--blue-soft)}
  .radio-card input{margin-top:3px}
  .radio-card .t{font-weight:700;font-size:13.5px}
  .radio-card .d{font-size:12.5px;color:var(--gray)}
  .spinner{width:34px;height:34px;border:4px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast-wrap{position:fixed;right:18px;bottom:18px;z-index:95;display:flex;flex-direction:column;gap:10px}
  .toast{background:#3A0A12;color:#fff;border-radius:10px;padding:13px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;max-width:380px;display:flex;gap:10px;align-items:flex-start;animation:slidein .25s ease}
  .toast.ok{background:var(--green)} .toast.err{background:var(--red)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .notice{border-radius:8px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
  .notice.warn{background:var(--amber-soft);color:#8F5F00}
  .notice.info{background:var(--blue-soft);color:#8A2538}
  .notice.err{background:var(--red-soft);color:#A8151C}
  .notice.ai{background:var(--purple-soft);color:#4C2E8E}
  .notice b{display:block;margin-bottom:2px}
  details.cov{margin-top:30px}
  details.cov summary{cursor:pointer;font-weight:700;color:var(--navy)}
  details.cov .card{margin-top:10px}
  .crumb{font-size:12.5px;color:var(--gray);margin-bottom:6px}
  .astep{opacity:0;animation:fadeup .45s forwards;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;margin-bottom:8px;background:#FBFAFA;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .astep.ok{border-color:#BFE3D0;color:var(--green)}
  .astep.fail{border-color:#E8BFC3;color:var(--red)}
  .astep.info{border-color:#F0CDD1;color:var(--navy-2,var(--navy))}
  @keyframes fadeup{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (max-width:860px){
    .layout{flex-direction:column}
    .sidebar{width:100%;position:static;display:flex;flex-wrap:wrap;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
    .sidebar .grp{width:100%;padding:8px 6px 2px}
    .sidebar a{border-left:none;border-bottom:3px solid transparent;padding:7px 10px}
    .sidebar a.on{border-bottom-color:var(--blue)}
  }
  @media (max-width:440px){ .modal .g2{grid-template-columns:1fr} }
  @media (max-width:640px){ table.tbl{font-size:12.5px} }
</style>
</head>

/* ---- the mock ML model: deterministic, explainable ---- */
function predictRisk(app){
  const hh=(app.income&&app.income.hh)||"", pci=(app.income&&app.income.pci)||"";
  const c=[]; let s=0;
  const hhS = hh.indexOf("1,999")>=0?55 : hh.indexOf("2,000")>=0?30 : hh.indexOf("4,000")>=0?15 : hh.indexOf("6,000")>=0?8 : hh.indexOf("8,000")>=0?5 : 20;
  if(hhS){ c.push({k:"Household income band ("+hh+")",v:hhS}); s+=hhS; }
  const pciS = pci.indexOf("800")>=0?15 : pci.indexOf("1,000")>=0?6 : pci.indexOf("1,500")>=0?3 : 0;
  if(pciS){ c.push({k:"Per-capita band ("+pci+")",v:pciS}); s+=pciS; }
  const m=(app.income&&app.income.members)||0;
  const mS = m>=6?10 : m===5?7 : m===4?4 : m===3?2 : 0;
  if(mS){ c.push({k:"Household size ("+m+" members)",v:mS}); s+=mS; }
  const f=app.feesDue||0;
  const fS = f>=300?8 : f>=150?4 : 0;
  if(fS){ c.push({k:"Outstanding fees pressure ("+money(f)+")",v:fS}); s+=fS; }
  s=Math.max(0,Math.min(100,Math.round(s)));
  const level = s>=55?"High" : s>=30?"Medium" : "Low";
  const reco  = level==="High"?"Tier 2 (SBFAS)" : level==="Medium"?"Tier 1 (SBFAS)" : "No SBFAS — monitor";
  const conf  = Math.min(0.97, 0.62 + Math.abs(s-50)/160).toFixed(2);
  return { score:s, level, reco, conf, contrib:c.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)) };
}

/* ---- rule-based eligibility: auto MOEFAS assessment ---- */
function runAssessment(app){
  const steps=[];
  if(MODEL.incomeDown){
    steps.push({t:"income service unavailable — application held; retry available (ranges never blocked)",cls:"fail"});
    app.status="Submitted — assessment"; app.held=true;
    modelLog(app.ref+" — income service timeout; application held","fail");
    return steps;
  }
  app.held=false;
  const inc=incomeLookup(app.nric);
  app.income=inc;
  steps.push({t:"income service (by NRIC "+app.nric+"): "+inc.members+" household members · HH band "+inc.hh+" · PCI band "+inc.pci+" — ranges only, stored with retrieval date",cls:"ok"});
  const hhOK = inc.hh.indexOf("1,999")>=0 || inc.hh.indexOf("2,000")>=0;
  const pciOK = inc.pci.indexOf("≤")>=0;
 steps.push({t:"rule check (conditions combine with AND): Nationality = Singapore Citizen ✓ · Household band ≤ S$3,999 "+(hhOK?"✓":"")+" · PCI band ≤ S$1,000 "+(pciOK?"✓":""),cls:(hhOK&&pciOK)?"ok":"fail"});
  if(hhOK&&pciOK){
    const tier = inc.hh.indexOf("1,999")>=0 ? MOEFAS_SCHEME.tiers[0] : MOEFAS_SCHEME.tiers[1];
    app.status="MOEFAS granted";
    app.moefas={tier:tier.name,grantedOn:TODAY,conditions:"Nationality ✓ · Household band ✓ · PCI band ✓"};
    steps.push({t:"tier match: "+tier.name+" ("+tier.band+") — MOEFAS granted automatically, no waiting for a person. Two tiers matching would use the higher subsidy.",cls:"ok"});
    modelLog(app.ref+" — MOEFAS auto-granted at "+tier.name,"ok");
  } else {
    app.status="Awaiting school decision";
    app.moefas={tier:null,note:"No tier met — routed to school SBFAS queue ("+TODAY+")"};
    const r=predictRisk(app);
    steps.push({t:"no tier met → routed to the school's SBFAS queue · AI prediction attached: "+r.level+" risk (score "+r.score+") · recommends "+r.reco,cls:"info"});
    modelLog(app.ref+" — routed to SBFAS queue; prediction "+r.level,"info");
  }
  return steps;
}

/* fuzzy search (token AND + Damerau-Levenshtein) */
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
         .replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
}
function levBound(a,b,k){
  if(Math.abs(a.length-b.length)>k) return k+1;
  let p2=null, p1=[], cur=[];
  for(let j=0;j<=b.length;j++) p1[j]=j;
  for(let i=1;i<=a.length;i++){
    cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      let v=Math.min(p1[j]+1, cur[j-1]+1, p1[j-1]+cost);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,(p2? p2[j-2]:k+1)+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>k) return k+1;
    p2=p1; p1=cur; cur=[];
  }
  return p1[b.length];
}
function fuzzyMaxDist(tok){ return tok.length<=2?0 : tok.length<=5?1 : 2; }
function fuzzyToken(tok, fields){
  const t=norm(tok); if(!t) return true;
  const k=fuzzyMaxDist(t);
  return fields.some(f=> f.indexOf(t)>=0 ||
    f.split(" ").some(w=>{ const ww=w.replace(/[^a-z0-9]/g,""); return !!ww && levBound(t,ww,k)<=k; }));
}
function fuzzyMatch(query, record){
  const toks=norm(query).split(" ").filter(Boolean);
  if(!toks.length) return true;
  const fields=record.map(norm);
  return toks.every(t=> fuzzyToken(t,fields));
}

      </div>
    </div></div>`;}).join("")}
 <div class="notice info"><span><b>Recurring schedules</b>Active rules run automatically on their schedule; conditions are re-checked at run time and each account is credited at most once per run.</span></div>
  ${coverageTable()}`;

function rulePreview(r){
  const eligible=Object.values(STUDENTS).filter(s=>{
    if(!s.account||s.account.status!=="Active") return false;
    if(r.school!=="All schools"&&s.school!==r.school) return false;
    const sec=r.level.indexOf("Secondary")===0, pri=r.level.indexOf("Primary")===0;
    if(sec&&!/Secondary/.test(s.level)) return false;
    if(pri&&!/Primary/.test(s.level)) return false;
    return true;
  });
  const skipped=eligible.filter(s=>s._bal+r.amount>r.cap).length;
  return {count:eligible.length-skipped,skipped};
}
function ruleRun(id){
  if(simLocked()) return;
  const r=BATCH_RULES.find(x=>x.id===id);
  const prev=rulePreview(r);
  let credited=0,skipped=0;
  Object.values(STUDENTS).forEach(s=>{
    if(!s.account||s.account.status!=="Active") return;
    if(r.school!=="All schools"&&s.school!==r.school) return;
    const sec=r.level.indexOf("Secondary")===0, pri=r.level.indexOf("Primary")===0;
    if(sec&&!/Secondary/.test(s.level)) return;
    if(pri&&!/Primary/.test(s.level)) return;
    if(s._bal+r.amount>r.cap){ skipped++; return; }
    s.ledger.push({date:TODAY,type:"Top-up",desc:"Batch: "+r.name,ref:r.id,amount:r.amount});
    recompute(s); credited++;
  });
  TOPUP_TX.unshift({id:"TU-"+Math.floor(9000+Math.random()*900),date:TODAY,type:"Batch",target:r.name,students:credited,amount:credited*r.amount,status:credited?"Success":"Failed",reason:credited?null:"No eligible accounts"});
  r.lastRun=TODAY;
  toast("Batch executed — "+credited+" credited, "+skipped+" skipped (balance cap/duplicate). Result recorded.","ok");
  render();
}
function ruleToggle(id){
  if(simLocked()) return;
  const r=BATCH_RULES.find(x=>x.id===id);
  r.status=r.status==="Active"?"Paused":(r.status==="Paused"?"Active":r.status);
  toast("Rule "+r.id+" is now "+r.status+".","ok"); render();
}

  if(simLocked()) return;

function ruleSave(id){
  const name=$("#ruName").value.trim(), amt=parseFloat($("#ruAmt").value), cap=parseFloat($("#ruCap").value)||0;
  if(!name||!(amt>0)){ toast("Name and a positive amount are required (validation).","err"); return; }
  if(id){
    const r=BATCH_RULES.find(x=>x.id===id);
    Object.assign(r,{name:name,school:$("#ruSchool").value,level:$("#ruLevel").value,amount:amt,cap:cap,freq:$("#ruFreq").value});
    toast("Rule updated — change recorded in the audit trail.","ok");
  } else {
    BATCH_RULES.push({id:"BR-"+String(BATCH_RULES.length+1).padStart(2,"0"),name:name,school:$("#ruSchool").value,level:$("#ruLevel").value,amount:amt,cap:cap,freq:$("#ruFreq").value,status:"Draft",nextRun:"—",lastRun:"—"});
    toast("Rule created as Draft — activate it to schedule runs.","ok");
  }
  closeModal(); render();
}

    TOPUP_TX.map(t=>[t.id,t.date,t.type,t.target,t.students,t.amount.toFixed(2),t.status,t.reason||""]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="topup-transactions.csv"; a.click();
  toast("Exported filtered transaction set (CSV).","ok");

function budgetSave(kind){
  if(simLocked()) return;
  const amt=parseFloat(state.budgetDraft);
  if(!(amt>0)){ toast("Enter a valid amount greater than 0.","err"); return; }
  if(kind==="moefas"){
    const m=BUDGET.moefas;
    m.changes.unshift({date:TODAY,from:money(m.amount),to:money(amt),by:state.admin.name});
    m.amount=amt;
  } else {
    const b=BUDGET.sbfas[state.admin.scope];
    b.changes.unshift({date:TODAY,from:money(b.amount),to:money(amt),by:state.admin.name});
    b.amount=amt;
  }
  state.budgetDraft="";
  toast("Budget updated — old value, new value, user and date are kept.","ok");
  render();
}

/* ---- Fee dashboard tab (HQ): all schools → drill into school → student ---- */
function feeDashRows(schoolName){
  const rows=[];
  Object.values(STUDENTS).forEach(st=>{
    if(schoolName && st.school!==schoolName) return;
    st.charges.forEach(c=>rows.push({st,c,ft:FEE_TYPES.find(f=>f.id===c.ftId)}));
  });
  return rows;
}
function feeAgg(rows){
  const paidRows=rows.filter(r=>r.c.status==="paid"), openRows=rows.filter(r=>r.c.status!=="paid");
  return { fee:rows.reduce((s,r)=>s+feeOf(r.c),0),
           sub:rows.reduce((s,r)=>s+subsidyOf(r.c),0),
           pay:rows.reduce((s,r)=>s+payableOf(r.c),0),
           collected:paidRows.reduce((s,r)=>s+payableOf(r.c),0),
           outstanding:openRows.reduce((s,r)=>s+payableOf(r.c),0),
           paidRows, openRows };
}

const PIE_COLORS=["#8A2538","#A8343F","#18794A","#8F5F00","#6B46C1","#B3261E","#0891B2","#65A30D"];
function pieChart(data, centerLabel){   /* SVG donut — no external chart library needed for the mock */
  const tot=data.reduce((s,d)=>s+d.value,0);
  if(!tot) return '<div class="muted">No charges to chart.</div>';
  const R=62, W=30, CIRC=2*Math.PI*R, GAP=3;
  let off=0, slices="";
  data.forEach(d=>{
    if(d.value<=0) return;
    const len=d.value/tot*CIRC;
    const draw=Math.max(0,len-GAP);
    slices+='<circle cx="75" cy="75" r="'+R+'" fill="none" stroke="'+d.color+'" stroke-width="'+W+'" stroke-dasharray="'+draw+' '+(CIRC-draw)+'" stroke-dashoffset="'+(-off-GAP/2)+'"></circle>';
    off+=len;
  });
  const legend=data.filter(d=>d.value>0).map(d=>
    '<div style="display:flex;align-items:center;gap:9px;font-size:13.5px;padding:5px 0">'+
    '<span style="width:12px;height:12px;border-radius:4px;background:'+d.color+';flex:none"></span>'+
    '<span style="flex:1;min-width:150px">'+esc(d.label)+'</span>'+
    '<b style="white-space:nowrap">'+money(d.value)+'</b>'+
    '<span class="muted" style="width:56px;text-align:right">'+(100*d.value/tot).toFixed(1)+'%</span></div>').join("");
  return '<div style="display:flex;gap:30px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 2px">'+
    '<svg width="190" height="190" viewBox="0 0 150 150" style="flex:none;filter:drop-shadow(0 1px 2px rgba(16,24,40,.12))">'+
      '<g transform="rotate(-90 75 75)">'+slices+'</g>'+
      '<text x="75" y="68" text-anchor="middle" font-size="11" fill="#8A8082">'+esc(centerLabel||"Total")+'</text>'+
      '<text x="75" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#7A1F2B">'+money(tot)+'</text>'+
    '</svg>'+
    '<div style="flex:1;min-width:260px;max-width:430px;display:grid;gap:2px">'+legend+'</div></div>';
}
function feeDashSchoolBody(name){
  const allRows=feeDashRows(name);
  const lvOpts=[...new Set(allRows.map(r=>r.st.level))].sort();
  const ftOpts=FEE_TYPES.filter(f=>f.school===name);
  const rows=allRows.filter(r=> (!state.feeDashLevel || r.st.level===state.feeDashLevel) &&
                                (!state.feeDashFt    || r.c.ftId===state.feeDashFt) );
  const a=feeAgg(rows);

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px">
    <div class="card"><div class="card-h"><h3>By level / cohort</h3></div><div class="card-b"><div style="overflow:auto"><table class="tbl">${head("Level / Cohort")}

    <div class="card"><div class="card-h"><h3>By class</h3></div><div class="card-b"><div style="overflow:auto"><table class="tbl">${head("Class")}

function planSave(){
  const d=state.planDraft, errors=[];
  if(!d.name.trim()) errors.push("name");
  const comps=[];
  d.rows.forEach((r,i)=>{
    const amt=parseFloat(r.amount);
    if(!(amt>0)) errors.push("row"+i);
    else comps.push({name:r.name.trim(), amount:Math.round(amt*100)/100, mfcId:r.isLocal?null:r.mfcId, isLocal:!!r.isLocal});
  });
  if(!comps.length && !errors.some(e=>String(e).indexOf("row")===0)) errors.push("rows");
  if(errors.length){ d.errors=errors; planModalRender(); return; }
  if(d.id){
    const f=FEE_TYPES.find(x=>x.id===d.id);
    f.name=d.name.trim(); f.components=comps; f.updated=TODAY;   /* keep the fee's origin and extraction level untouched */
    toast("School fee updated. Already-issued charges keep their original amounts.","ok");
  } else {
    FEE_TYPES.push({id:"FT-"+String(FEE_TYPES.length+1).padStart(2,"0"), school:d.school, name:d.name.trim(), masterId:"", own:true, components:comps, updated:TODAY});   /* no level — it is chosen at assign time */
    toast("School fee created — next, assign it to a level under Assign fees to generate charges.","ok");
  }
  state.planDraft=null;
  closeModal(); render();
}

function histRounds(){   /* filter + group the school's charges into issuance rounds */
  const school=state.admin.scope;
  const all=Object.values(STUDENTS).filter(s=>s.school===school)
    .flatMap(s=>s.charges.map(c=>({s,c,ft:FEE_TYPES.find(f=>f.id===c.ftId)})));
  const q=(state.histQ||"").trim(), termSel=state.histTerm||"", statusSel=state.histStatus||"All", kindSel=state.histKind||"";
  const kindOf=ft=>(ft&&ft.masterId)?"moe":"sch";
  const MK={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
  const dkey=d=>{const p=String(d).split(" ");return p.length===3?(+p[2])*10000+((MK[p[1]]||0)*100)+ +p[0]:0;};
  const isoK=v=>{const p=String(v||"").split("-");return p.length===3?(+p[0])*10000+(+p[1])*100+(+p[2]):0;};   /* the date inputs return yyyy-mm-dd — same comparable key as dkey */
  const fromK=isoK(state.histFrom), toK=isoK(state.histTo);
  const charges=all.filter(({s,c,ft})=>{
    if(kindSel && kindOf(ft)!==kindSel) return false;
    if(termSel && c.term!==termSel) return false;
    if(statusSel!=="All" && (statusSel.toLowerCase()==="paid")!==(c.status==="paid")) return false;
    if(q && !fuzzyMatch(q,[s.name,s.studentId,s.klass,s.level,c.title,(ft&&ft.name)||"",(ft&&ft.id)||"",c.term])) return false;
    if(fromK||toK){ const ik=dkey(c.issued); if(fromK&&ik<fromK) return false; if(toK&&ik>toK) return false; }
    return true;
  });
  const map=new Map();   /* one row per issuance round = same issued date + term (the school's action, not a student view).
                            MOE bills and school bills are never generated together, so they never share a round — the kind rides on the key */
  charges.forEach(x=>{
    const kind=kindOf(x.ft);
    const key=x.c.issued+"|"+x.c.term+"|"+kind;
    if(!map.has(key)) map.set(key,{key, kind, issued:x.c.issued, term:x.c.term, items:[], fts:new Map(), students:new Set(), levels:new Set(), classes:new Set(), total:0, outstanding:0, paid:0});
    const g=map.get(key);
    g.items.push(x); g.students.add(x.s.id); g.levels.add(x.s.level); g.classes.add(x.s.klass);
    const fk=x.c.ftId||x.c.title;
    if(!g.fts.has(fk)) g.fts.set(fk,{title:x.c.title, ft:x.ft, comps:x.c.components, count:0, total:0});
    const t=g.fts.get(fk);
    t.count++; t.total+=feeOf(x.c);
    g.total+=feeOf(x.c);
    if(x.c.status==="paid") g.paid++; else g.outstanding++;
  });
  const groups=[...map.values()].sort((a,b)=> dkey(b.issued)-dkey(a.issued));
  return { groups, nCharges:groups.reduce((n,g)=>n+g.items.length,0), total:groups.reduce((s,g)=>s+g.total,0), fromK, toK };
}
function histBodyHtml(){   /* the school's issued charges, split the way they were generated: MOE bills vs school bills */
  const {groups,nCharges,total,fromK,toK}=histRounds();
  if(!groups.length) return '<div class="empty"><div class="big"></div>No charges match your filters.</div>';
  const kindSel=state.histKind||"";
  const secs=[
    ["moe",'<span class="badge b-blue">MOE</span> <b>MOE bills</b>',"MOE bill"],

    <div class="hint" style="margin:0 0 10px">${nCharges} charge${nCharges===1?"":"s"} in ${groups.length} issuance round${groups.length===1?"":"s"} · total fee value ${money(total)}${fromK||toK?" · issued-date filter active":""}${kindSel?" · "+(kindSel==="moe"?"MOE bills only":"School bills only"):""}</div>
    ${secs.map(([kind,label,word])=>{

      return `
      <div style="margin:14px 0 8px;font-size:13px">${label} — ${list.length} issuance round${list.length===1?"":"s"} · ${nCh} charge${nCh===1?"":"s"} · total fee value ${money(tot)}</div>
      <div style="overflow:auto"><table class="tbl">
        <tr><th style="width:26px"></th><th>Issued</th><th>Charge</th><th>Term</th>${HIST_SHOW_DUE?"<th>Due</th>":""}<th class="num">Amount</th></tr>
        ${list.map(g=>{

          <td style="white-space:nowrap">${esc(g.issued)}</td>
          <td><b>${esc(summary)}</b><br>
              <span class="muted" style="font-size:12px">${esc([...g.levels].join(", "))} · ${g.fts.size} fee type${g.fts.size===1?"":"s"} · ${g.students.size} student${g.students.size===1?"":"s"} · ${g.items.length} charge${g.items.length===1?"":"s"}</span></td>
          <td>${esc(g.term)}</td>
          ${HIST_SHOW_DUE?`<td style="white-space:nowrap">${esc(g.items[0].c.due)}</td>`:""}
          <td class="num" style="font-weight:700">${money(g.total)}</td>
        </tr>
        ${open?`<tr><td colspan="${HIST_SHOW_DUE?6:5}" style="padding:0">${histRoundHtml(g)}</td></tr>`:""}`;
        }).join("")}
      </table></div>`;
    }).join("")}`;
}

function assignPickerCtx(){   /* the student picker narrows level → class → name before listing students */
  const a=state.assign;
  const school=a.school||state.admin.scope;
  const schFees=FEE_TYPES.filter(f=>f.school===school&&!f.masterId);
  const tickedOf=f=>{ const sel=(a.comps||{})[f.id]; return sel? f.components.filter(c=>sel.includes(c.id||c.name)):f.components.slice(); };
  const srcs=(a.schIds||[]).map(id=>schFees.find(f=>f.id===id)).filter(Boolean).map(f=>({ft:f,comps:tickedOf(f)})).filter(x=>x.comps.length);
  const allClasses=CLASSES.filter(c=>c.school===school);
  const allStuds=Object.values(STUDENTS).filter(s=>s.school===school);

    let ft, snap;
    if(src.kind==="MOE"){   /* MOE bill — assigning only EXTRACTS from the catalogue (whole type, stable); the charge carries the whole component set */
      ft=FEE_TYPES.find(f=>f.school===a.school&&f.masterId===src.mft.id&&f.level===lvl);   /* reuse this level's extraction when it already exists */
      if(ft){ snap=ft.id+" reused"; }
      else{
        ft={id:"FT-"+String(FEE_TYPES.length+1).padStart(2,"0"), school:a.school, level:lvl, name:src.mft.name, masterId:src.mft.id, updated:TODAY,
            components:src.mft.components.map(c=>({name:c.name,amount:c.amount,mfcId:c.id,isLocal:false}))};
        FEE_TYPES.push(ft);
        snap=ft.id+" extracted from "+src.mft.id;
      }
    } else { ft=src.ft; snap="school bill "+ft.id; }
    notes.push(ft.name+" ("+snap+", "+src.comps.length+" component"+(src.comps.length===1?"":"s")+")");
    studs.forEach(st=>{
      const already=st.charges.some(c=>((c.ftId&&c.ftId===ft.id)||c.title===ft.name)&&c.term===a.term);
      if(already){ skipped++; return; }
      st.charges.push({ id:"CH-"+(++CH_SEQ), ftId:ft.id, title:ft.name, term:a.term,
        issued:TODAY, due:TERM_DUE[a.term]||"13 Nov 2026", status:"outstanding",
        components:src.comps.map(c=>({name:c.name,amount:c.amount})) });
      created++; if(!students.includes(st.id)) students.push(st.id);
    });
  });
  const totalPerStudent=srcs.reduce((s,x)=>s+x.comps.reduce((t,c)=>t+c.amount,0),0);
  a.result={created,skipped,who,level:lvl,classes:klassList.length,classNames:klassList.map(k=>k.name).join(", "),
    types:srcs.length,totalPerStudent,term:a.term,students,
    snap:" Bills: "+notes.join(", ")+"."};
  toast("Generated "+created+" charge(s), skipped "+skipped+" duplicate(s).","ok");
  render();
}

  </div></div>`;

function refreshStuFeesBody(){ $("#stuFeesBody").innerHTML=stuFeesBody(); }
function stuGroups(){
  const q=state.stuFeesQ.trim(), status=state.stuFeesStatus, schoolSel=state.stuFeesSchool, levelSel=state.stuFeesLevel;
  const students=isHQ()? Object.values(STUDENTS) : Object.values(STUDENTS).filter(s=>s.school===state.admin.scope);
  const groups=[];
  students.forEach(st=>{
    if(schoolSel && st.school!==schoolSel) return;
    if(levelSel && st.level!==levelSel) return;
    const charges=[];
    st.charges.forEach(c=>{
      if(status!=="All" && (status.toLowerCase()==="paid")!==(c.status==="paid")) return;   /* only All / Outstanding (all unpaid) / Paid — overdue is not surfaced */
      const ft=FEE_TYPES.find(f=>f.id===c.ftId);
      if(q && !fuzzyMatch(q,[st.name,st.studentId,st.klass,st.school,c.title,(ft&&ft.name)||"",c.term])) return;
      charges.push({c,ft});
    });
    if(!charges.length) return;
    let payable=0, paid=0, collect=0;
    charges.forEach(({c})=>{ const p=payableOf(c); payable+=p; if(c.status==="paid") paid+=p; else collect+=p; });
    groups.push({st, charges, payable, paid, collect});
  });
  groups.sort((a,b)=> (b.collect>0)-(a.collect>0) || a.st.school.localeCompare(b.st.school) || a.st.name.localeCompare(b.st.name));
  return groups;
}
function stuToggle(id){ state.stuFeesOpen[id]=!state.stuFeesOpen[id]; refreshStuFeesBody(); }
function chargeBadge(s){
  return s==="paid"?'<span class="badge b-green"><span class="dot"></span>Paid</span>'
       :'<span class="badge b-amber"><span class="dot"></span>Outstanding</span>';
}
function stuFeesBody(){
  const groups=stuGroups();
  if(!groups.length) return '<div class="empty"><div class="big"></div>No students match your filters.</div>';
  let nCharges=0, tPay=0, tPaid=0, tColl=0, nOpen=0;
  groups.forEach(g=>{ nCharges+=g.charges.length; tPay+=g.payable; tPaid+=g.paid; tColl+=g.collect; if(g.collect>0) nOpen++; });
  return `
  <div class="stat-row" style="margin-bottom:14px">
    <div class="stat"><div class="lbl">Students shown</div><div class="val">${groups.length}</div><div class="muted">${nOpen} with fees to collect · ${nCharges} charges</div></div>
    <div class="stat"><div class="lbl">Total payable</div><div class="val">${money(tPay)}</div><div class="muted">all fee types, after FAS subsidy</div></div>
    <div class="stat"><div class="lbl">Paid</div><div class="val" style="color:var(--green)">${money(tPaid)}</div><div class="muted">already collected</div></div>
    <div class="stat"><div class="lbl">To collect</div><div class="val" style="color:${tColl?"var(--red)":"var(--green)"}">${money(tColl)}</div><div class="muted">all unpaid charges</div></div>
  </div>
  <div style="overflow:auto"><table class="tbl">
    <tr><th style="width:26px"></th><th>Student</th>${isHQ()?"<th>School</th>":""}<th>Level / Class</th><th class="num">Charges</th><th class="num">Total payable</th><th class="num">Paid</th><th class="num">To collect</th></tr>
    ${groups.map(g=>{
      const open=!!state.stuFeesOpen[g.st.id];
      return `<tr class="clickable" onclick="stuToggle('${g.st.id}')">
      <td>${open?"▼":"▶"}</td>

      <td class="num">${g.charges.length}</td>
      <td class="num" style="font-weight:700">${money(g.payable)}</td>

      <td class="num" style="font-weight:700;color:${g.collect?"var(--red)":"var(--green)"}">${money(g.collect)}</td>
    </tr>

    }).join("")}
  </table></div>`;
}
function stuDetailHtml(g){
  const byType=[];
  g.charges.forEach(({c,ft})=>{

  });
  return `<div style="padding:12px 14px;background:#FBFAFA">
    <div style="font-size:13px;color:var(--navy)"><b>${esc(g.st.name)}</b> — fee position across ${byType.length} fee type${byType.length>1?"s":""}: payable <b>${money(g.payable)}</b> · paid <b style="color:var(--green)">${money(g.paid)}</b> · to collect <b style="color:${g.collect?"var(--red)":"var(--green)"}">${money(g.collect)}</b></div>
    ${byType.map(grp=>{
      let fee=0, sub=0, paid=0, coll=0;
      grp.charges.forEach(c=>{ fee+=feeOf(c); sub+=subsidyOf(c); if(c.status==="paid") paid+=payableOf(c); else coll+=payableOf(c); });
      return `<div style="margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff">
      <div style="padding:9px 12px;background:var(--gray-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>${grp.ft?esc(grp.ft.name):"Other school charges"}</b>
        ${grp.ft?`<span class="mono muted">${esc(grp.ft.id)}</span>`:""}
        <span class="muted" style="font-size:12.5px">${grp.charges.length} charge${grp.charges.length>1?"s":""} · fee value ${money(fee)}${sub?" · FAS subsidy − "+money(sub):""} · to collect <b style="color:${coll?"var(--red)":"var(--green)"}">${money(coll)}</b></span>
      </div>
      ${grp.charges.map(c=>`
      <div style="padding:10px 12px;border-top:1px solid var(--line)">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px">
          <b>${esc(c.title)}</b><span class="mono muted">${esc(c.id)}</span> · ${esc(c.term)} · due <b>${esc(c.due)}</b> ${chargeBadge(c.status)}
          ${c.status==="paid"?`<span class="muted" style="font-size:12px">paid ${esc(c.paidOn)} · ${esc(c.paidBy)} · receipt <span class="mono">${esc(c.receipt)}</span></span>`:""}
        </div>
        <div style="overflow:auto"><table class="tbl" style="margin-top:8px">
          <tr><th>Component</th><th class="num">Fee</th><th class="num">FAS subsidy</th><th class="num">Payable</th></tr>
          ${c.components.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${money(x.amount)}</td>
            <td class="num" style="color:${x.subsidy?"var(--green)":"var(--gray)"}">${x.subsidy?"− "+money(x.subsidy):"—"}</td>
            <td class="num">${money(Math.max(0,x.amount-(x.subsidy||0)))}</td></tr>`).join("")}
          <tr style="background:#FBFAFA"><td style="font-weight:700">Charge total</td><td class="num" style="font-weight:700">${money(feeOf(c))}</td>
            <td class="num" style="font-weight:700;color:var(--green)">− ${money(subsidyOf(c))}</td>
            <td class="num" style="font-weight:800;color:var(--navy)">${money(payableOf(c))}</td></tr>
        </table></div>
      </div>`).join("")}
    </div>`;}).join("")}
  </div>`;
}

    return `
  <div class="charge"><div class="charge-h">
 <div style="flex:1;min-width:220px"><div class="ttl">${esc(m.name)} &nbsp;${MASTER_SHOW_ID?`<span class="badge b-blue">${esc(m.id)}</span> `:""}<span class="badge b-purple">${esc(m.levelScope)}</span>${m.mandatory?' <span class="badge b-red" title="Schools must apply this MOE fee type">Mandatory</span>':''}</div>
    <div class="ref">Last updated ${esc(m.updated)} · ${m.components.length} component${m.components.length===1?"":"s"} · used by <b>${plans.length}</b> school plan${plans.length===1?"":"s"}${schools.length?" ("+schools.length+" school"+(schools.length===1?"":"s")+")":""}</div></div>
    <div class="payable-big" style="font-size:15px">${money(m.components.reduce((s,c)=>s+c.amount,0))}</div>
    ${isHQ()?`<button class="btn btn-ghost btn-sm" onclick="masterEdit('${m.id}')" ${state.sim?"disabled":""}>Edit</button>`:'<span class="badge b-gray">read-only</span>'}
  </div><div class="charge-b">
    <div style="overflow:auto"><table class="tbl">
    <tr><th>Fee component</th><th class="num">Default</th></tr>
    ${m.components.map(c=>{
      return `<tr>
        <td><b>${esc(c.name)}</b>${MFC_SHOW_ID?` <span class="mono muted">${esc(c.id)}</span>`:""}</td>
        <td class="num">${money(c.amount)}</td>
      </tr>`;}).join("")}
    </table></div>
    ${schools.length?`<div class="muted" style="margin-top:8px;font-size:12.5px">Used by: ${schools.map(s=>esc(s)).join(" · ")}</div>`:`<div class="muted" style="margin-top:8px;font-size:12.5px">No school has built a plan from this fee type yet.</div>`}
  </div></div>`;}).join("")
 :'<div class="card"><div class="empty"><div class="big"></div>No fee type matches your search.</div></div>';
}
function refreshHandbookList(){ $("#handbookBody").innerHTML=handbookBodyHtml(); }   /* typing in the search box refreshes only the cards — the input keeps focus */
function viewHandbook(){
  return `
 <h1 class="page">Fee Handbook</h1>
 <div class="notice info" style="margin-bottom:14px"><span><b>This handbook is generated live from the master catalogue</b>When a MOE HQ user edits a fee type in ${isHQ()?`<a href="#" onclick="nav('master');return false" style="color:var(--blue)">Master catalogue</a>`:"the Master catalogue (maintained by MOE HQ)"} — adding or removing fee types and components or changing defaults — the handbook updates automatically. Nothing is maintained twice.</span></div>
  <div class="card" style="margin-bottom:16px"><div class="card-b">
    <div class="search-row">
      <input placeholder="Search fee type or component…" value="${esc(state.handbookQ)}" oninput="state.handbookQ=this.value;refreshHandbookList()">
      <button class="btn btn-primary" onclick="render()">Search</button>
 <button class="btn btn-ghost" onclick="state.handbookQ='';nav('master')">${isHQ()?"View catalogue →":"My school fees →"}</button>
    </div>
  </div></div>
  <div id="handbookBody">${handbookBodyHtml()}</div>
 <div class="notice info"><span><b>Only MOE-created fee types are listed</b>School-local fees never appear here — they live in the school's own fee catalogue.</span></div>
  ${coverageTable()}`;
}

/* =====================================================================
   COVERAGE NOTE
   ===================================================================== */
function coverageTable(){
  return "";
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>

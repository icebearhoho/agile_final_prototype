<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>MOE e-Service Portal — Education Account (Parent Mock)</title>
<style>
  :root{
    --navy:#7A1F2B; --navy-2:#8A2538;
    --blue:#A8343F; --blue-soft:#F9E3E5;
    --red:#B3261E; --red-soft:#FDE3E3;
    --sp-red:#D93841; --sp-red-hover:#B0262D;   /* Singpass Button Design Specification (1 Sep 2026) */
    --green:#18794A; --green-soft:#E4F4EC;
    --amber:#8F5F00; --amber-soft:#FDF1D6;
    --purple:#6B46C1; --purple-soft:#F3EDFC;
    --gray:#5E5658; --gray-soft:#F6F3F3;
    --line:#E4DEDE;
    --ink:#1A1512;
    --radius:10px;
    --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
    --shadow-lg:0 10px 28px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter Variable","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#F8F6F6;font-size:15px;line-height:1.55}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}

  /* ---------- chrome ---------- */
  .app-header{background:var(--navy);color:#fff}
  .app-header .inner{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .crest{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px}
  .brand{flex:1;min-width:220px}
  .brand b{display:block;font-size:16px}
  .brand span{font-size:12px;opacity:.75}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:13px}
  .user-chip .avatar{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .user-chip button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px}

  .sub-nav{background:#fff;border-bottom:1px solid var(--line)}
  .sub-nav .inner{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
  .sub-nav a{padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--gray);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
  .sub-nav a.active{color:var(--blue);border-bottom-color:var(--blue)}

  main{max-width:1080px;margin:0 auto;padding:26px 20px 60px}

  /* ---------- generic ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card .card-h h3{font-size:15px}
  .card .card-b{padding:18px}
  h1.page{font-size:22px;margin-bottom:4px}
  p.page-sub{color:var(--gray);font-size:13.5px;margin-bottom:22px}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:#7A1F2B}
  .btn-danger{background:var(--red);color:#fff}
  .btn-danger:hover{background:#c02525}
  .btn-ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .btn-purple{background:var(--purple);color:#fff}
  .btn-purple:hover{filter:brightness(.93)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-sm{padding:7px 12px;font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-gray{background:var(--gray-soft);color:var(--gray)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-purple{background:var(--purple-soft);color:var(--purple)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
  .muted{color:var(--gray);font-size:13px}
  .mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tbl th{background:var(--gray-soft);text-align:left;padding:9px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);border-bottom:1px solid var(--line)}
  table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  table.tbl tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pos{color:var(--green);font-weight:600}
  .neg{color:var(--red);font-weight:600}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--blue);text-decoration:none;font-size:13.5px;font-weight:600;margin-bottom:14px}
  .empty{padding:34px 20px;text-align:center;color:var(--gray)}
  .empty .big{font-size:34px;margin-bottom:8px}

  /* ---------- login ---------- */
  .login-wrap{max-width:460px;margin:48px auto}
  .login-logo{text-align:center;margin-bottom:18px}
  /* Official button per Singpass Button Design Specification (effective 1 Sep 2026):
     red variant — bg #D93841 / hover #B0262D, white logo, label "Log in with Singpass",
     Poppins Bold 16px (system sans fallback), min-height 44px, 4px logo↔label gap.
     The real integration must embed the OFFICIAL Singpass logo image asset. */
  .singpass-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--sp-red);color:#fff;border:none;border-radius:8px;padding:12px 16px;font-size:16px;font-weight:700;min-height:44px}
  .singpass-btn:hover{background:var(--sp-red-hover)}
  .singpass-btn .sp-word{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .divider{display:flex;align-items:center;gap:12px;color:var(--gray);font-size:12px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- dashboard ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .stat .val{font-size:22px;font-weight:700}
  .child-card{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .child-id{min-width:200px;flex:1}
  .child-id .nm{font-size:16px;font-weight:700}
  .child-id .meta{font-size:13px;color:var(--gray);margin-top:2px}
  .bal-box{min-width:180px}
  .bal-box .lbl{font-size:11.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.05em}
  .bal-box .val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .child-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- pills ---------- */
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--gray)}
  .pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* ---------- charges ---------- */
  .charge{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;background:#fff}
  .charge.overdue{border-color:#E8BFC3}
  .charge-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;background:#FBFAFA;border-bottom:1px solid var(--line)}
  .charge-h .ttl{font-weight:700;font-size:14.5px}
  .charge-h .ref{font-size:12px;color:var(--gray)}
  .charge-b{padding:14px 16px}
  .charge-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:#FBFAFA}
  .payable-big{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  details.subsidy-note{margin-top:8px;font-size:12.5px;color:var(--gray)}
  details.subsidy-note summary{cursor:pointer;color:var(--blue);font-weight:600}

  /* ---------- modal / toast ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
  .modal{background:#fff;border-radius:14px;max-width:480px;width:100%;box-shadow:var(--shadow-lg);max-height:92vh;overflow:auto}
  .modal .m-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center}
  .modal .m-b{padding:20px}
  .modal .m-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
  .kv{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
  .kv td{padding:7px 4px;border-bottom:1px dashed var(--line)}
  .kv td:first-child{color:var(--gray)}
  .kv td:last-child{text-align:right;font-weight:600}
  .radio-card{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer}
  .radio-card.sel{border-color:var(--blue);background:var(--blue-soft)}
  .radio-card input{margin-top:3px}
  .radio-card .t{font-weight:700;font-size:13.5px}
  .radio-card .d{font-size:12.5px;color:var(--gray)}
  .spinner{width:34px;height:34px;border:4px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast-wrap{position:fixed;right:18px;bottom:92px;z-index:95;display:flex;flex-direction:column;gap:10px}
  .toast{background:#3A0A12;color:#fff;border-radius:10px;padding:13px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;max-width:360px;display:flex;gap:10px;align-items:flex-start;animation:slidein .25s ease}
  .toast.ok{background:var(--green)} .toast.err{background:var(--red)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

  .notice{border-radius:8px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
  .notice.warn{background:var(--amber-soft);color:#8F5F00}
  .notice.info{background:var(--blue-soft);color:#8A2538}
  .notice.err{background:var(--red-soft);color:#A8151C}
  .notice.ai{background:var(--purple-soft);color:#4C2E8E}
  .notice b{display:block;margin-bottom:2px}

  /* ---------- AI chat widget ---------- */
  .chat-fab{position:fixed;right:18px;bottom:18px;z-index:85;width:56px;height:56px;border-radius:50%;background:var(--purple);color:#fff;border:none;box-shadow:var(--shadow-lg);font-size:22px;display:none;align-items:center;justify-content:center}
  .chat-fab:hover{filter:brightness(1.08)}
  .chat-fab.show{display:flex}
  .chat-fab .ping{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 7px;border:2px solid #fff}
  .chat-panel{position:fixed;right:18px;bottom:18px;z-index:88;width:min(400px,calc(100vw - 28px));height:min(560px,calc(100vh - 120px));background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden}
  .chat-panel.show{display:flex}
  .chat-h{background:var(--purple);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .chat-h .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px}
  .chat-h .t b{display:block;font-size:14.5px}
  .chat-h .t span{font-size:11.5px;opacity:.85}
  .chat-h .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
  .chat-h .tools button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:6px;font-size:11.5px;padding:4px 8px}
  .chat-h .tools .x{font-size:14px;padding:4px 9px}
  .chat-body{flex:1;overflow-y:auto;padding:14px;background:#FBFAF9;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;border-radius:12px;padding:9px 12px;font-size:13.5px;white-space:pre-wrap}
  .msg.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
  .msg.user{background:var(--purple);color:#fff;border-top-right-radius:4px;align-self:flex-end}
  .msg .msg-tag{display:inline-block;background:var(--purple-soft);color:var(--purple);font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-bottom:5px}
  .msg .msg-actions{display:flex;flex-direction:column;gap:6px;margin-top:9px}
  .msg .msg-actions button{text-align:left;background:var(--purple);color:#fff;border:none;border-radius:7px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .msg .msg-actions button.ghost{background:#fff;color:var(--purple);border:1px solid var(--purple)}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--purple);opacity:.4;animation:blink 1s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .chat-chips{padding:8px 12px 4px;display:flex;gap:6px;flex-wrap:wrap;background:#FBFAF9;border-top:1px solid var(--line)}
  .chat-chips button{background:#fff;border:1px solid var(--purple);color:var(--purple);border-radius:999px;font-size:12px;font-weight:600;padding:5px 11px}
  .chat-f{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
  .chat-f input{flex:1;border:1.5px solid #DDD7D7;border-radius:9px;padding:9px 12px;font-size:13.5px}
  .chat-f button{background:var(--purple);color:#fff;border:none;border-radius:9px;padding:0 15px;font-weight:700}
  .chat-off{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;background:#FBFAF9}
  .chat-off .box{max-width:300px;text-align:center;font-size:13.5px;color:var(--gray)}

  /* ---------- FAS form ---------- */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:#2E2628}
  .field label .req{color:var(--red)}
  .field input[type=text],.field input[type=tel],.field select{width:100%;border:1.5px solid #DDD7D7;border-radius:8px;padding:9px 11px;font-size:13.5px;background:#fff}
  .field input:read-only{background:var(--gray-soft);color:#5E5658}
  .field.err input,.field.err select{border-color:var(--red);background:#FFFBFB}
  .field .hint{font-size:11.5px;color:var(--gray);margin-top:3px}
  .field.err .hint{color:var(--red);font-weight:600}
  .ai-tag{display:inline-flex;align-items:center;gap:4px;background:var(--purple-soft);color:var(--purple);font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .field.ro input{background:var(--gray-soft)}
  .check-line{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:9px;cursor:pointer;background:#fff}
  .check-line.on{border-color:var(--purple);background:var(--purple-soft)}
  .check-line input{margin-top:3px}
  .check-line .t{font-weight:700;font-size:13.5px}
  .check-line .d{font-size:12.5px;color:var(--gray)}
  .form-sec{margin-bottom:22px}
  .form-sec h4{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .decl{border:1.5px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:10px;background:#FBFAFA;margin:16px 0}
  .decl.err{border-color:var(--red);background:var(--red-soft)}
  .form-err-box{border:1px solid #E8BFC3;background:var(--red-soft);color:#A8151C;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}

  /* ---------- Singpass mock IdP (published flow: PAR→auth→callback→token→id_token) ---------- */
  .browser{display:flex;flex-direction:column;min-height:430px}
  .b-bar{display:flex;align-items:center;gap:8px;background:#E4DEDE;padding:10px 14px;border-bottom:1px solid var(--line)}
  .b-dot{width:11px;height:11px;border-radius:50%;flex:none}
  .b-dot.r{background:#FF5F57}.b-dot.y{background:#FEBC2E}.b-dot.g{background:#28C840}
  .b-url{flex:1;background:#fff;border-radius:999px;font-size:10.5px;color:var(--gray);padding:5px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .b-body{padding:24px 22px;background:#fff;text-align:center}
  .idp-logo{font-weight:800;font-size:24px;color:var(--sp-red);letter-spacing:-.02em}
  .qr{position:relative;width:196px;height:196px;margin:14px auto;border:8px solid #fff;box-shadow:0 0 0 1px var(--line),var(--shadow);background:#fff}
  .qr i{position:absolute;width:4.762%;height:4.762%;background:#1A1512}
  .qr .finder{position:absolute;width:33.33%;height:33.33%;border:6px solid #1A1512;border-radius:4px}
  .qr .finder::after{content:"";position:absolute;inset:15%;background:#1A1512;border-radius:2px}
  .qr .f1{left:0;top:0}.qr .f2{right:0;top:0}.qr .f3{left:0;bottom:0}
  .phone{max-width:290px;margin:0 auto;border:9px solid #1A1512;border-radius:26px;background:#fff;overflow:hidden;text-align:left}
  .phone .p-h{background:var(--sp-red);color:#fff;font-weight:800;text-align:center;padding:10px;font-size:14px}
  .phone .p-b{padding:14px 12px}
  .trace{list-style:none;margin:16px 0 0;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:#FBFAFA;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-align:left}
  .trace li{padding:6px 0 6px 20px;position:relative;border-bottom:1px dashed var(--line);color:var(--gray)}
  .trace li:last-child{border-bottom:none}
  .trace li::before{position:absolute;left:0;font-weight:800}
  .trace li.ok{color:var(--ink)} .trace li.ok::before{content:"✓";color:var(--green)}
  .trace li.run{color:var(--ink)} .trace li.run::before{content:"›";color:var(--blue)}
  .trace li.fail{color:var(--red);font-weight:600} .trace li.fail::before{content:"✕";color:var(--red)}

  details.cov{margin-top:34px}
  details.cov summary{cursor:pointer;font-weight:700;color:var(--navy)}
  details.cov .card{margin-top:10px}
  .crumb{font-size:12.5px;color:var(--gray);margin-bottom:6px}
  .ai-hero{background:linear-gradient(120deg,#4C2E8E,#6B46C1);color:#fff;border-radius:14px;padding:22px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .ai-hero .big{font-size:36px}
  .ai-hero h2{font-size:19px;margin-bottom:4px}
  .ai-hero p{font-size:13.5px;opacity:.9;max-width:560px}
  @media (max-width:640px){ .bal-box .val{font-size:20px} table.tbl{font-size:12.5px} }
  /* print only the offline form (R5), hide the rest of the page */
  @media print{ body *{visibility:hidden} #offPrint,#offPrint *{visibility:visible} #offPrint{position:absolute;left:0;top:0;width:100%} }
</style>
</head>
<body>

<header class="app-header">
  <div class="inner">
    <div class="crest">MOE</div>
    <div class="brand">
      <b>MOE e-Service Portal</b>
      <span>Education Account · for parents and guardians</span>
    </div>
    <div id="userChip"></div>
  </div>
</header>
<nav class="sub-nav"><div class="inner" id="subNav"></div></nav>

<main id="app"></main>

<!-- AI assistant (mock) — E12: US-056 / US-057 -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" title="Ask the AI assistant">🤖<span class="ping" id="chatPing" style="display:none">1</span></button>
<div class="chat-panel" id="chatPanel">
  <div class="chat-h">
    <div class="ic">🤖</div>
    <div class="t"><b>Ask MOE-AI</b><span>e-Service Portal helper · mock</span></div>
    <div class="tools">
      <button onclick="toggleAiUnavailable()" id="aiTglBtn" title="Demo control">Simulate unavailable</button>
      <button class="x" onclick="toggleChat()">✕</button>
    </div>
  </div>
  <div id="chatBodyWrap" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-chips" id="chatChips"></div>
    <div class="chat-f">

/* =====================================================================
   SINGPASS LOGIN (mock) — implemented in the order published at
   docs.developer.singpass.gov.sg (Singpass Login · OIDC / FAPI 2.0):
   1. POST /fapi/par (Pushed Authorization Request) → request_uri (60 s)
   2. Browser redirect to /fapi/auth?client_id&request_uri → user scans QR
      with the Singpass app (biometrics / passcode) — up to 10 minutes
   3. Redirect back to redirect_uri with code + state + iss
   4. POST /fapi/token — PKCE (S256) + client_assertion (private_key_jwt)
      + DPoP proof → access_token (30 min) + id_token (code expires 60 s)
   5. Decrypt & verify id_token → sub + uinfin
   6. Link uinfin to the MOE parent profile → session created
   Staging endpoints are shown because this is a demo.
   ===================================================================== */
const SP = {
  par:"https://stg-id.singpass.gov.sg/fapi/par",
  auth:"https://stg-id.singpass.gov.sg/fapi/auth",
  token:"https://stg-id.singpass.gov.sg/fapi/token",
  iss:"https://stg-id.singpass.gov.sg/fapi",
  client:"M0EeServicePortalDemoAppID1234",
  redirect:"https://eservice.moe.gov.sg/auth/callback"
};
const SP_USERS=[
  {nric:"S7234567A", name:"Tan Wei Ming", note:"Parent of 3 children"},
  {nric:"S8156789B", name:"Wong Li Ling", note:"Parent of 1 child (closed account demo)"},
  {nric:"S9999999Y", name:"New Singpass user", note:"Not linked to any MOE parent profile (error path)"}
];
let spTimer=null, spSecs=60, spNric=null;
function spClearTimer(){ if(spTimer){ clearInterval(spTimer); spTimer=null; } }
function spBrowser(url,inner){
 modal('<div class="browser"><div class="b-bar"><span class="b-dot r"></span><span class="b-dot y"></span><span class="b-dot g"></span><span class="b-url">'+esc(url)+'</span></div><div class="b-body" id="spBody">'+inner+'</div></div>');
}
function qrHtml(){
  let s=42; const rnd=()=>{ s=(s*9301+49297)%233280; return s/233280; };
  let cells="";
  for(let y=0;y<21;y++) for(let x=0;x<21;x++){
    const inFinder=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    if(!inFinder && rnd()>0.52) cells+='<i style="left:'+(x*4.762).toFixed(2)+'%;top:'+(y*4.762).toFixed(2)+'%"></i>';
  }
  return '<div class="qr">'+cells+'<span class="finder f1"></span><span class="finder f2"></span><span class="finder f3"></span></div>';
}

/* Steps 1–2: PAR was pushed; the browser lands on the Singpass authorize
   page showing a QR code for the app. */
function spStart(){
  spNric=null; spSecs=60;
  spBrowser(SP.auth+"?client_id="+SP.client+"&request_uri=urn:ietf:params:oauth:request_uri:8xK…",
    '<div class="idp-logo">Singpass</div>'+
    '<p style="font-size:15px;font-weight:700;margin-top:10px">Log in with Singpass</p>'+
    '<p class="muted" style="margin:4px 0 0">Scan the QR code with the Singpass app on your phone</p>'+
    qrHtml()+
    '<p class="muted" style="margin:0">QR refreshes in <b id="spCount">60</b> s · whole login valid for 10 min</p>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">'+
 '<button class="btn btn-danger" onclick="spApp()">Simulate scanning with the app</button>'+
      '<button class="btn btn-ghost" onclick="spCancel()">Cancel</button>'+
    '</div>'+
    '<p class="muted" style="margin-top:14px;font-size:11.5px">Mock of id.singpass.gov.sg — the request was pushed via PAR (RFC 9126):<br>POST '+SP.par+' → request_uri (valid 60 s)</p>');
  spTimer=setInterval(()=>{
    const el=$("#spCount"); if(!el){ spClearTimer(); return; }
    el.textContent=--spSecs;
    if(spSecs<=0){ spClearTimer(); $("#spBody").innerHTML='<div style="padding:30px 0"><div style="font-size:34px">⌛</div><p style="font-weight:700;margin-top:8px">The login session expired</p><p class="muted">Please start again.</p><button class="btn btn-danger" style="margin-top:14px" onclick="spStart()">Try again</button></div>'; }
  },1000);
}

function spApp(){

/* Step 3: redirect back to the relying party with code + state + iss. */
function spVerify(btn){
  const sel=document.querySelector('.phone input[name="spu"]:checked');
  const idx=[...document.querySelectorAll('.phone input[name="spu"]')].indexOf(sel);
  spNric=SP_USERS[idx<0?0:idx].nric;
  btn.outerHTML='<div style="text-align:center;padding:10px 0"><div class="spinner"></div><p style="margin-top:10px;font-size:13px">Verifying your face…</p></div>';
  setTimeout(()=>{
 $("#spBody").innerHTML='<div style="padding:26px 0"><div style="font-size:40px"></div><p style="font-weight:700;margin-top:8px">Face verified</p><p class="muted">Returning to MOE e-Service Portal…</p></div>';
    setTimeout(spCallback,900);
  },1100);
}
function spCallback(){
  const code="cbk_"+Math.random().toString(36).slice(2,10);
  const st="8f2b1c-"+Math.random().toString(36).slice(2,8);
  spBrowser(SP.redirect+"?code="+code+"&state="+st+"&iss="+encodeURIComponent(SP.iss),
 '<div style="font-size:30px"></div>'+
    '<p style="font-weight:700;margin-top:6px">Signing you in…</p>'+
    '<p class="muted" style="margin:2px 0 0">The portal server completes the login (mock trace)</p>'+
    '<ul class="trace" id="spTrace"></ul>');
  const steps=[
    "callback received: code="+code+" · state="+st+" · iss verified ✓",
    "POST "+SP.token+" — grant_type=authorization_code · PKCE S256 · client_assertion (private_key_jwt) · DPoP proof",
    "→ access_token (30 min) + id_token received",
    "decrypt & verify id_token → sub, uinfin="+spNric,
  ];
  let i=0;
  const tick=()=>{
    if(i>0){ const prev=$("#spTrace") && $("#spTrace").children[i-1]; if(prev) prev.className="ok"; }
    if(i>=steps.length){ spFinish(); return; }
    const T=$("#spTrace"); if(!T) return;
    const li=document.createElement("li"); li.className="run"; li.textContent=steps[i]; T.appendChild(li); i++;
    spTimer=setTimeout(tick,750);
  };
  tick();
}

/* Steps 4–6: token exchange done — link the uinfin to a parent profile. */
function spFinish(){

  const parent=Object.values(PARENTS).find(p=>p.nric===spNric);

 aiPush("ai","Hello "+parent.name.split(" ")[0]+" I'm the portal assistant (mock AI). Ask me how anything works — paying fees, checking a balance, transactions, or applying for financial assistance.",

      toast("Signed in as "+parent.name+" via Singpass (mock).","ok");
      render();
      $("#chatPing").style.display="inline-block";
    },900);
  } else {
    li.className="fail"; li.textContent="link uinfin → MOE parent profile: NOT FOUND for "+spNric;
    T.appendChild(li);
    setTimeout(()=>{
      $("#spBody").innerHTML=
 '<div style="padding:10px 0"><div style="font-size:34px"></div>'+
        '<p style="font-weight:700;margin-top:8px;color:var(--red)">No linked parent profile</p>'+

    },900);
  }
}

/* ---------- Settlement: updates balances, charge, ledger; guards double-pay ---------- */
let paying = {};
function settlePayment(cid, chid, methodLabel){
  const st = STUDENTS[cid], c = st.charges.find(x=>x.id===chid);
  if(paying[chid] || c.status==="paid"){ closeModal(); return; } // AC-044-03 double confirm
  paying[chid] = true;
  const pay = payableOf(c);
  if(methodLabel==="Education Account"){
    st.ledger.push({ date:TODAY, type:"Fee payment", desc:c.title, ref:c.id, amount:-pay });
    recompute(st);
  } else {
    st.ledger.push({ date:TODAY, type:"Fee payment", desc:c.title+" (paid online — "+methodLabel.replace("Online payment · ","")+")", ref:c.id, amount:0, bal:st._bal, onlineOnly:true });
  }
  c.status="paid"; c.paidOn=TODAY; c.paidBy=methodLabel; c.receipt="PAY-1012-"+Math.floor(1000+Math.random()*9000);
  delete paying[chid];
  closeModal();
  toast("Payment successful — "+money(pay)+" for “"+c.title+"”. "+(methodLabel==="Education Account"?"New balance: "+money(st._bal)+". ":"")+"Receipt "+c.receipt+".", "ok");
  render();
}

/* ---- fuzzy tolerance for the chat input: correct typos against an intent
   vocabulary before matching (e.g. "balnace" → "balance", "pya" → "pay").
   Tokens that already match, contain digits, or are beyond the distance
   threshold are left untouched. */
const AI_VOCAB=["pay","payment","fee","balance","transaction","history","owe","outstanding","charge","account","close","closed","cpf","topup","top-up","singpass","fas","financial","assistance","moefas","sbfas","subsidy","apply","income","address","phone","contact","update","tax","passport","restart","cancel","stop","child","children","school","portal","transaction"];
function aiNorm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
         .replace(/[^a-z0-9 -]+/g," ").replace(/\s+/g," ").trim();
}
function aiLev(a,b,k){
  /* Damerau-Levenshtein (optimal string alignment) — counts adjacent
     transpositions ("pya"→"pay" = 1), bounded by k */
  if(Math.abs(a.length-b.length)>k) return k+1;
  let p2=null, p1=[], cur=[];
  for(let j=0;j<=b.length;j++) p1[j]=j;
  for(let i=1;i<=a.length;i++){
    cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      const cost=a[i-1]===b[j-1]?0:1;
      let v=Math.min(p1[j]+1, cur[j-1]+1, p1[j-1]+cost);
      if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) v=Math.min(v,(p2? p2[j-2]:k+1)+1);
      cur[j]=v; if(v<best) best=v;
    }
    if(best>k) return k+1;
    p2=p1; p1=cur; cur=[];
  }
  return p1[b.length];
}
function fuzzyCorrect(text){
  return String(text).split(/(\s+)/).map(tok=>{
    if(!tok || /^\s+$/.test(tok)) return tok;
    const t=aiNorm(tok);
    if(!t || /\d/.test(t)) return tok;
    const stems=[t, t.replace(/s$/,""), t.replace(/ing$/,""), t.replace(/ing$/,"e"), t.replace(/ed$/,"")];
    for(const s of stems){
      if(AI_VOCAB.indexOf(s)>=0) return s;
      const pref=AI_VOCAB.find(v=> t.length>=3 && v.indexOf(t)===0 );
      if(pref) return pref;
    }
    const k = t.length<=4 ? 1 : 2;
    let best=null, bd=99;
    for(const v of AI_VOCAB){
      const d=aiLev(t,v,k);
      if(d<bd){ bd=d; best=v; }
    }
    return (best && bd<=k) ? best : tok;
  }).join("");
}

/* ---- the mock brain: returns [text, tag, chips, actions] ---- */
function aiThink(text){
  const t=fuzzyCorrect(text).toLowerCase();
  const p=state.parent, kids=p.children.map(id=>STUDENTS[id]);

  /* 1) privacy guard — never shows other families' data (AC-056-03) */
  const foreign=kids.every(k=>!t.includes(k.name.toLowerCase().split(" ")[0]) && !t.includes(k.name.toLowerCase()));
  const knownOthers=["lim xue er","wong kai en","neighbour","neighbor","other family","my friend","classmate"];
  if(foreign && knownOthers.some(n=>t.includes(n))){
    return ["I'm sorry, I can only help with your own family's accounts and information in this portal. I can't show or discuss another family's data.",
      "Privacy", ["Where is my child's balance?","How do I pay a fee?"]];
  }

  /* 2) restart / cancel works at any point of a conversation */
  if(/\b(restart|start over|start again|cancel|stop|nevermind|never mind)\b/.test(t)){
    const wasFas = (state.ai.stage && state.ai.stage.indexOf("fas")===0) || /\bfas\b|financial|answers/.test(t);
    state.ai.gathered = {};
    state.ai.stage = wasFas ? "fas-q1" : null;
    return wasFas
      ? ["No problem — let's start again. How many family members live in your household, including yourself?",null,["5","4","6"]]
      : ["OK, I've cleared that. Ask me anything else about the portal.",null,[]];
  }

  /* 3) mid-conversation follow-ups (US-057).
     A pending follow-up only accepts short answers; a longer / question-like
     message is treated as a new topic and the pending question is dropped. */
  let digress=false;
  const isQuestion = t.includes("?") || t.length>32;
  if(state.ai.stage){
    const s=state.ai.stage;
    if(s==="pay-vague"){
      state.ai.stage=null;
      if(t.includes("balance")||t.includes("account")) return payFromEaAnswer();
      if(t.includes("online")||t.includes("card")||t.includes("paynow")||t.includes("nets")) return payOnlineAnswer();
      return payFullAnswer();
    }
    if(s==="fas-q1"){
      const n=parseInt(t.replace(/[^0-9]/g,""),10);
      if(!n||n<1||n>20){ if(isQuestion){digress=true;} else return ["Sorry, how many household members is that? Please give a number (for example: 5).",null,["5","6","4"]]; }
      else{
        state.ai.gathered.householdSize=String(n);
        state.ai.stage="fas-q2";
        return ["Got it — "+n+" household members. And what best describes your current employment status?",null,
          ["Employed","Self-employed","Not employed","Retired"]];
      }
    }
    if(s==="fas-q2"){
      const map={"self":"Self-employed","not employed":"Not employed","unemployed":"Not employed","retired":"Retired","employed":"Employed"};
      const hit=Object.keys(map).find(k=>t.includes(k));
      if(!hit){ if(isQuestion){digress=true;} else return ["Sorry, which of these best describes your employment status?",null,["Employed","Self-employed","Not employed","Retired"]]; }
      else{
        state.ai.gathered.employment=map[hit];
        state.ai.stage="fas-q3";
        return ["Thank you. Last question — what type of housing does your household live in?",null,
          ["HDB 1–2 room","HDB 3-room & above","Private"]];
      }
    }
    if(s==="fas-q3"){
      const map={"1":"HDB 1–2 room","2":"HDB 1–2 room","3":"HDB 3-room & above","private":"Private","condo":"Private","landed":"Private"};
      const hit=Object.keys(map).find(k=>t.includes(k)) || (t.includes("hdb")?"HDB 3-room & above":null);
      if(!hit){ if(isQuestion){digress=true;} else return ["Sorry, which housing type is it?",null,["HDB 1–2 room","HDB 3-room & above","Private"]]; }
      else{
        state.ai.gathered.housing = map[hit]!==undefined ? map[hit] : hit;
        state.ai.stage=null;
 return ["That's everything I need \nI can now pre-fill the family FAS application for you. Your profile details (name, NRIC, contact, address) and these answers will be filled in — you review and edit everything before submitting.",
          "Ready to pre-fill", null,
 [{label:"Open pre-filled FAS application", act:"nav('fas');fasPrefill();"},
           {label:"Tell me about FAS first", act:"aiHandleDirect('what is fas')", ghost:true}]];
      }
    }
  }
  if(digress){ state.ai.stage=null; }

  /* 4) FAS intents */
  if(/\b(fas|financial assistance|moefas|sbfas|subsidy|subsidies|assistance)\b/.test(t)||t.includes("apply for help")||t.includes("cannot afford")||t.includes("difficulty paying")||t.includes("need help with fees")){
    if(t.includes("what is fas")||t.includes("what is the fas")||t.includes("difference")||t.includes("tell me about fas")){
      return ["The Financial Assistance Scheme (FAS) helps families with school fees:\n\n• MOEFAS — assessed by MOE rules first, using official household income bands.\n• School-based FAS — if MOEFAS is not granted, your child's school reviews the application and decides.\n\nA student receives one or the other, never both. Any subsidy granted is shown directly on your outstanding charges.",
        null, ["I want to apply for FAS","How is my income checked?"]];
    }
    if(t.includes("income")||t.includes("how is my")){
      return ["You don't need to key in income figures. During assessment the system retrieves your official household and per-capita income bands from a third-party income service (queried by NRIC). Only the ranges are used — never exact amounts.",
        null, ["I want to apply for FAS"]];
    }
    const g=state.ai.gathered;
    if(g.householdSize&&g.employment&&g.housing){   // AC-057-02: don't ask twice
      return ["I already have your answers (household of "+g.householdSize+", "+g.employment+", "+g.housing+"). You can open the pre-filled application, or change an answer first.",
        "Already collected", null,
 [{label:"Open pre-filled FAS application", act:"nav('fas');fasPrefill();"},
         {label:"Change my answers", act:"aiHandleDirect('restart fas answers')", ghost:true}]];
    }
    state.ai.stage="fas-q1";
    return ["I can help you apply for the Financial Assistance Scheme as one family application. I'll ask "+fasQuestionsRemaining()+" short questions and then pre-fill the form for you.\n\nFirst: how many family members live in your household, including yourself?",
      "FAS application", ["5","4","6"]];
  }

  /* 4) payment — vague gets a follow-up (AC-057-01) */
  if(/\bpay\b|payment|fee/.test(t)){
    if(/^(\s*)(how do i pay|how to pay|pay how|help me pay|can i pay)\??\s*$/.test(t) || t==="pay"){
      state.ai.stage="pay-vague";
      return ["Happy to explain! Which way would you like to pay?",
        null, ["From the Education Account balance","Online (card / PayNow / NETS)"]];
    }
    if(t.includes("online")||t.includes("card")||t.includes("paynow")||t.includes("nets")) return payOnlineAnswer();
    if(t.includes("balance")||t.includes("account")) return payFromEaAnswer();
    return payFullAnswer();
  }

  /* 5) balance */
  if(t.includes("balance")||t.includes("how much")||t.includes("money left")){
    return ["You can see each child's Education Account balance on the dashboard (“My Children”), and per-charge amounts under Outstanding Charges.\n\n"+kids.filter(k=>k.account).map(k=>"• "+k.name+": "+money(k._bal)).join("\n")+"\n\nBalances update immediately after a top-up or payment.",
      "Your data", null,
      [{label:"Open My Children", act:"nav('dashboard')", ghost:true},
       {label:"View outstanding charges", act:"nav('charges',{childId:'"+(state.childId&&STUDENTS[state.childId].account?state.childId:kids.find(k=>k.account).id)+"'})", ghost:true}]];
  }

  /* 6) transactions */
  if(t.includes("transaction")||t.includes("history")||t.includes("statement")||t.includes("where the money")){
    return ["Every Education Account keeps a full transaction list — top-ups, fee payments and transfers — newest first, with the running balance after each entry.\n\nGo to Transactions in the top menu, then pick the child.",
      null, [{label:"Open Transactions", act:"nav('transactions',{childId:'"+(state.childId&&STUDENTS[state.childId].account?state.childId:kids.find(k=>k.account).id)+"'})", ghost:true}]];
  }

  /* 7) outstanding / owe */
  if(t.includes("owe")||t.includes("outstanding")||t.includes("due")||t.includes("charges")){
    const rows=kids.map(k=>({k,out:k.charges.filter(c=>c.status!=="paid").reduce((a,c)=>a+payableOf(c),0)})).filter(r=>r.out>0);
 return ["Outstanding charges are listed per child under Outstanding Charges, with each fee component, any FAS subsidy and the total payable.\n\n"+(rows.length?rows.map(r=>"• "+r.k.name+": "+money(r.out)).join("\n"):"Nothing is outstanding — all caught up! "),
      "Your data", null,
      rows.length?[{label:"Open Outstanding Charges", act:"nav('charges',{childId:'"+rows[0].k.id+"'})", ghost:true}]:[]];
  }

  /* 8) account creation / age 7 */
  if(t.includes("account")&&(t.includes("create")||t.includes("open")||t.includes("7")||t.includes("when")) && !/clos|16|cpf/.test(t)){
    return ["Education Accounts are created automatically when a Singapore Citizen child turns 7 — you don't need to apply. The account then stays open until age 16.\n\nIf a child of yours is over 7 and has no account, contact MOE via the enquiry page.",
      null, ["When does the account close?","Where is my child's balance?"]];
  }

  /* 9) closure / CPF */
  if(t.includes("16")||t.includes("close")||t.includes("closed")||t.includes("cpf")){
    return ["When a student turns 16, the Education Account closes automatically. Any remaining balance is transferred to CPF (mock behaviour shown in Transactions, e.g. Wong Kai En's account).\n\nAfter closure the account can no longer top up or pay fees — history stays viewable.",
      null, ["Where is my child's balance?"]];
  }

  /* 10) top-up */
  if(t.includes("top-up")||t.includes("topup")||t.includes("top up")||t.includes("government")){
    return ["Top-ups come from the government's Education Account fund and are credited automatically — you don't top up yourself. They appear in Transactions as “Top-up” entries.\n\nIf a top-up looks missing, wait 1 working day, then contact MOE.",
      null, ["Show my transactions","Where is my child's balance?"]];
  }

  /* 11) update personal details (US-042 flavour) */
  if(t.includes("address")||t.includes("phone")||t.includes("contact")||t.includes("update my")){
    return ["You can update your residential address, mailing address and contact number from your profile. Name, NRIC and date of birth are read-only for security — contact MOE to change those.",
      null, ["I want to apply for FAS"]];
  }

  /* 12) out of scope (AC-056-02) */
  if(/tax|passport|ica|immigration|hospital|clinic|driving|traffic|visa/.test(t)){
    return ["I'm sorry, that's outside what I can help with — I only cover this e-Service portal's functions (accounts, balances, transactions, fee payment and FAS applications).\n\nFor other government matters, please visit the relevant agency's website, or contact MOE for education questions.",
      "Out of scope", ["What can you help with?","How do I pay a fee?"]];
  }

  /* 13) capabilities */
  if(t.includes("what can you")||t.includes("help me with")||t.includes("who are you")){
    return ["I'm the portal's mock AI assistant. I can:\n\n• Explain how every portal function works\n• Walk you through paying a charge\n• Answer questions about Education Accounts and FAS\n• Ask a few questions and pre-fill your FAS application",
      null, ["How do I pay a fee?","I want to apply for FAS","Where is my child's balance?"]];
  }

  /* 14) fallback */
  return ["I'm not sure I understood that. I can help with portal functions — balances, transactions, paying fees, Education Accounts and FAS applications. Could you rephrase, or pick a topic below?",
    null, ["How do I pay a fee?","Where is my child's balance?","I want to apply for FAS","What can you help with?"]];
}

function fasPrefill(){                                   // US-058-01/02/03

  render();
}
function fasSaveDraft(){                                  // US-051-01
  state.fas.status="draft";
  toast("Draft saved — you can continue any time.","ok");
  render();
}

/* ---------- R5: prefilled offline (paper) application ----------
   Everything already known (profile + any answers given here or to
   the assistant) is printed on the form; blanks are filled in by
   hand. The offline reference code lets the school pull the same
   data on their side instead of re-keying the paper form.        */
function offlineOpen(){
  const p=state.parent, f=state.fas, g=state.ai.gathered;
  const included=(f.selectedChildren.length? f.selectedChildren : p.children.filter(id=>STUDENTS[id].account));
  const kids=included.map(id=>STUDENTS[id].name+" ("+STUDENTS[id].klass+")").join(", ");
  const school=included.length? STUDENTS[included[0]].school : "—";
  const code="OFF-2026-"+String(Math.floor(1000+Math.random()*9000));
  OFFLINE_FORMS.push({ code:code, created:TODAY, nric:p.nric, name:p.name, children:kids, school:school,
    contact:f.form.contact||p.profile.contact, residential:f.form.residential||p.profile.residential,
    mailing:f.form.mailing||p.profile.mailing,
    householdSize:f.form.householdSize||g.householdSize||"", employment:f.form.employment||g.employment||"",
    housing:f.form.housing||g.housing||"", status:"Awaiting school collection", collectedOn:null });
  const blank="______________________";
  const row=(k,v)=>'<tr><td>'+k+'</td><td>'+(v?esc(v):blank)+'</td></tr>';
  modal(
    '<div class="m-h">Offline FAS application<button class="btn btn-sm btn-ghost" style="border-color:#DDD7D7;color:#2E2628" onclick="closeModal()">✕</button></div>'+
    '<div class="m-b"><div id="offPrint">'+
      '<div style="text-align:center;border-bottom:2px solid #7A1F2B;padding-bottom:10px;margin-bottom:14px">'+
        '<div style="font-weight:800;font-size:18px">Ministry of Education (Singapore)</div>'+
        '<div style="font-weight:700;font-size:15px;margin-top:2px">Financial Assistance Scheme — Offline Application Form</div>'+
        '<div style="font-size:11.5px;color:#5E5658">Prefilled from the e-Service Portal · '+TODAY+'</div></div>'+
      '<table class="kv" style="margin-top:0">'+
        '<tr><td><b>Offline reference code</b></td><td><b class="mono" style="font-size:16px">'+code+'</b></td></tr>'+
        row("Applicant (as per NRIC)",p.name)+row("NRIC",p.nric)+
        row("Contact number",f.form.contact||p.profile.contact)+
        row("Residential address",f.form.residential||p.profile.residential)+
        row("Mailing address (if different)",f.form.mailing||p.profile.mailing||"")+
        row("Children included",kids)+row("School",school)+
        row("Household size (incl. yourself)",f.form.householdSize||g.householdSize||"")+
        row("Employment status",f.form.employment||g.employment||"")+
        row("Housing type",f.form.housing||g.housing||"")+
      '</table>'+
      '<p style="font-size:12.5px;color:#2E2628;margin:10px 0 0">• <b>Income — nothing to fill in:</b> official household and per-capita income <b>bands</b> are retrieved by NRIC from the third-party income service during assessment; exact amounts are never needed.</p>'+
      '<p style="font-size:12.5px;color:#2E2628;margin:8px 0 0">• <b>Declaration:</b> I declare that the information in this application is true and complete, and I authorise MOE to verify the details with official sources.</p>'+
      '<div style="display:flex;gap:40px;margin-top:28px;font-size:13px"><div style="flex:1">Signature: ______________________</div><div style="flex:1">Date: ______________________</div></div>'+
 '<div class="notice info" style="margin-top:14px"><span><b>Submit at your child\'s school</b>'+esc(school)+' — the school officer retrieves your details using the offline reference code above, verifies the printed form with you and registers the application. No online submission is needed.</span></div>'+
    '</div></div>'+
    '<div class="m-f"><button class="btn btn-ghost" onclick="closeModal()">Close</button>'+
 '<button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button></div>'
  );
  toast("Offline application prepared — reference "+code+". Print it, sign and submit at the school office.","ok");
}
function fasSubmit(){                                     // US-049-01/02
  const f=state.fas;
  f.selectedChildren=f.selectedChildren.filter(id=>STUDENTS[id].account);   // safety: exclude children without an account
  const errs=[];
  if(!f.selectedChildren.length) errs.push("children");
  if(!/^(\+65)?[\s\d]{8,}$/.test((f.form.contact||"").trim())) errs.push("contact");
  if(!(f.form.residential||"").trim()) errs.push("residential");
  if(!String(f.form.householdSize||"").trim()) errs.push("householdSize");
  if(!(f.form.employment||"").trim()) errs.push("employment");
  if(!f.declared) errs.push("declaration");
  f.errors=errs;
  if(errs.length){ toast("Some required details are missing — see the highlighted fields.","err"); render(); return; }
  f.status="submitted";
  f.refNo="FAS-2026-"+String(Math.floor(100+Math.random()*900));
  aiPush("ai","I see your FAS application has been submitted ("+f.refNo+"). Status: Submitted. I'll leave you to it — ask me anything else about the portal.",null,["Where is my child's balance?","How do subsidies show on charges?"]);
  toast("Application submitted — reference "+f.refNo+".","ok");
  render();
}

/* =====================================================================
   MY PERSONAL DETAILS  [R8 / US-042]
   Clicking the account chip opens this screen. Contact number and
   addresses are editable (validated, changes recorded with the date);
   identity fields are read-only. Saved values auto-fill FAS forms.
   ===================================================================== */
function viewProfile(){
  const p=state.parent, pr=p.profile, E=state.profileErrs||[];
  const err=k=>E.includes(k);
  const hist=p.profileHistory||[];
  return `
  <h1 class="page">My personal details</h1>
  <p class="page-sub">Update your contact details anytime. Changes are recorded with the date and are used automatically when you apply for financial assistance — where you can still edit every field.</p>
  <div class="card"><div class="card-b">
    <div class="form-sec"><h4>Identity — read-only for security</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px">
        <div class="field"><label>Full name (as per NRIC)</label><input type="text" readonly value="${esc(p.name)}"></div>
        <div class="field"><label>NRIC</label><input type="text" readonly value="${esc(p.nric)}"></div>
        <div class="field"><label>Linked via</label><input type="text" readonly value="Singpass"></div>
        <div class="field"><label>Children linked</label><input type="text" readonly value="${p.children.length} — ${p.children.map(id=>STUDENTS[id].name).join(", ")}"></div>
      </div>
 <div class="notice info" style="margin:4px 0 0"><span><b>Name, NRIC and linked children can't be changed here</b>Contact MOE to change identity information; children are linked through your Singpass profile.</span></div>
    </div>
    <div class="form-sec"><h4>Contact &amp; addresses — editable</h4>
      <div class="field ${err("contact")?"err":""}"><label>Contact number <span class="req" style="color:var(--red)">*</span></label>
        <input id="pfContact" type="tel" value="${esc(pr.contact)}" placeholder="+65 9123 4567">
        <div class="hint">${err("contact")?"That doesn't look like a valid Singapore contact number — please check and try again.":"A valid Singapore mobile/landline number, e.g. +65 9123 4567."}</div></div>
      <div class="field ${err("residential")?"err":""}"><label>Residential address <span class="req" style="color:var(--red)">*</span></label>
        <input id="pfRes" type="text" value="${esc(pr.residential)}">
        <div class="hint">${err("residential")?"Residential address is required.":"&nbsp;"}</div></div>
      <div class="field"><label>Mailing address (if different)</label>
        <input id="pfMail" type="text" value="${esc(pr.mailing)}">
        <div class="hint">Leave as the residential address if you don't need a separate mailing address.</div></div>
      <button class="btn btn-primary" onclick="profileSave()">Save changes</button>
    </div>
    ${hist.length?`
    <details class="cov"><summary>Change history (${hist.length})</summary>
      <div class="card" style="margin-top:10px"><div style="overflow:auto"><table class="tbl">
        <tr><th>Date</th><th>Field</th><th>From</th><th>To</th></tr>
        ${hist.map(h=>`<tr><td>${esc(h.date)}</td><td><b>${esc(h.field)}</b></td><td class="muted">${esc(h.from)}</td><td>${esc(h.to)}</td></tr>`).join("")}
      </table></div></div>
    </details>`:""}
 <div class="notice ai" style="margin-top:14px"><span><b>Used automatically in FAS applications</b>The next family application you start will be pre-filled with these details — and every field can still be edited by hand in the application.</span></div>
  </div></div>
  ${coverageTable()}`;
}
function profileSave(){
  const p=state.parent, pr=p.profile;
  const contact=$("#pfContact").value.trim();
  const res=$("#pfRes").value.trim();
  const mail=$("#pfMail").value.trim();
  const errs=[];
  if(!/^(\+65[\s-]?)?[6-9]\d{3}[\s-]?\d{4}$/.test(contact)) errs.push("contact");
  if(!res) errs.push("residential");
  state.profileErrs=errs;
  if(errs.length){ toast("Please check the highlighted fields — the change was not saved.","err"); render(); return; }
  const finalMail = (mail===pr.mailing && pr.mailing===pr.residential) ? res : (mail||res);  // un-customized mailing follows the residential address
  const changes=[];
  if(contact!==pr.contact) changes.push({date:TODAY,field:"Contact number",from:pr.contact,to:contact});
  if(res!==pr.residential) changes.push({date:TODAY,field:"Residential address",from:pr.residential,to:res});
  if(finalMail!==pr.mailing) changes.push({date:TODAY,field:"Mailing address",from:pr.mailing,to:finalMail});
  if(!changes.length){ toast("No changes to save."); return; }
  p.profile={contact:contact,residential:res,mailing:finalMail};
  p.profileHistory=(p.profileHistory||[]);
  changes.forEach(c=>p.profileHistory.unshift(c));
  toast("Personal details updated — recorded with today's date. New FAS applications will use these details automatically.","ok");
  render();
}

   COVERAGE NOTE
   ===================================================================== */
function coverageTable(){
  return "";
}

/* ---------- boot ---------- */
render();
</script>
